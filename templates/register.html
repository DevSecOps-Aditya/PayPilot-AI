<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · PayPilot AI</title>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("pp-theme") || "dark"; } catch (e) {}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="register">
<main class="auth-wrap">
  <div class="card auth-card">
    <a class="brand" href="/"><span class="brand-mark">P</span><span>PayPilot <small>AI</small></span></a>
    <h1 style="text-align:center">Create your account</h1>
    <p class="muted small" style="text-align:center">Takes under a minute. No card needed.</p>
    <form id="register-form" novalidate>
      <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" maxlength="60" required></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field-row">
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="currency">Currency</label>
          <select id="currency" name="currency">{% for c in currencies %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
      </div>
      <p class="xs muted" style="margin-top:calc(var(--sp-2) * -1)">At least 8 characters.</p>
      <p class="error-text" id="form-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <p class="small muted" style="text-align:center;margin:var(--sp-4) 0 0">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</main>
<script>window.PP = {{ pp_config|tojson }};</script>
<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
